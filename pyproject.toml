[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "RAG-FASTAPI"
version = "0.0.1"
authors = [
  { name="idanyfr-sudo"}]
description = "Simple RAG Pipeline on FastApi"
readme = "README.md"
requires-python = ">=3.9"


dependencies = [
  "fastapi==0.136.1",
  "openai==2.28.0",
  "langchain-text-splitters==1.1.1",
  "sentence-transformers==5.3.0",
  "psycopg2-binary==2.9.12",
  "pypdf==6.9.0"
]


[project.urls]
Homepage = "https://github.com/idanyfr-sudo/rag-fastapi"

https://github.com/idanyfr-sudo/rag-fastapi
